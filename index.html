<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi vida ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: #4a2030;
    }

    .card {
        width: 90%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.94);
        border-radius: 30px;
        padding: 35px 25px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,.2);
        position: relative;
        z-index: 2;
    }

    .heart {
        font-size: 55px;
        animation: latido 1.3s infinite;
    }

    @keyframes latido {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
    }

    h1 {
        margin: 10px 0 5px;
        color: #e83e6f;
        font-size: 32px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    .reason-box {
        background: #fff0f5;
        border-radius: 20px;
        padding: 25px 18px;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: opacity .3s, transform .3s;
    }

    .number {
        font-size: 14px;
        color: #e83e6f;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .reason {
        font-size: 20px;
        line-height: 1.5;
        font-weight: 500;
    }

    button {
        margin-top: 25px;
        border: none;
        background: #e83e6f;
        color: white;
        padding: 15px 25px;
        border-radius: 50px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(232,62,111,.3);
        transition: transform .2s, background .2s;
    }

    button:active {
        transform: scale(.94);
    }

    .footer {
        margin-top: 22px;
        font-size: 13px;
        color: #999;
    }

    .floating-heart {
        position: fixed;
        bottom: -30px;
        font-size: 20px;
        animation: subir 7s linear forwards;
        opacity: .7;
        z-index: 1;
    }

    @keyframes subir {
        0% {
            transform: translateY(0) rotate(0);
            opacity: 0;
        }
        20% {
            opacity: .8;
        }
        100% {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>Para Ale</h1>

    <div class="subtitle">
        100 razones por las que te quiero
    </div>

    <div class="reason-box" id="reasonBox">
        <div class="number" id="number"></div>
        <div class="reason" id="reason"></div>
    </div>

    <button onclick="nuevaRazon()">
        💕 Descubrir otra razón
    </button>

    <div class="footer">
        Espero que te guste ❤️
    </div>

</div>

"Y la número 100 es porque simplemente eres tu y te quiero. ❤️"

];

let ultima = -1;

function nuevaRazon() {

    let numero;

    do {
        numero = Math.floor(Math.random() * razones.length);
    } while (numero === ultima && razones.length > 1);

    ultima = numero;

    const box = document.getElementById("reasonBox");

    box.style.opacity = "0";
    box.style.transform = "scale(.95)";

    setTimeout(() => {

        document.getElementById("number").textContent =
            "Razón #" + (numero + 1);

        document.getElementById("reason").textContent =
            razones[numero];

        box.style.opacity = "1";
        box.style.transform = "scale(1)";

    }, 200);

}

function crearCorazon() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    heart.textContent = Math.random() > .5 ? "❤️" : "💕";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);
}

nuevaRazon();

setInterval(crearCorazon, 800);

</script>

</html>
